name: Security scan

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install with yarn (lifecycle scripts disabled)
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Scan files and full git history
        run: yarn scan:history
